<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arachne-OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="descktop-lockScreen ">
        <div class="overlay">
            <!-- <h1>hii dude</h1> -->
        </div>
         <button class="login-btn">Unlock OS</button>
    </div>

    <div class="descktop-main-screen hide">

        <div class ="sidebar">

            <div class="app chrome-app-btn" id="dockChromeBtn">
                <img src="./incons/1.jfif" alt="Chrome">
                <p>Chrome</p>
            </div>

            <div class="app">
                <img src="./incons/3.jfif" alt="Files">
                <p>Files</p>
            </div>

            <div class="app">
                <img src="./incons/5.jfif" alt="Settings">
                <p>Settings</p>
            </div>
            
            
            <!-- Start Button -->
            <div class="start">
                <div class="app">
                    <img src="./incons/start.jfif" alt="Start">
                    <p>Start</p>
                </div>
            </div>
            
        </div>

        <div class="appBox hide">
            
            <div class="app1 chrome-app-btn" id="chromeAppBtn">
                <img src="./incons/1.jfif" alt="Chrome">
                <p>Chrome</p>
            </div>
    
            <div class="app1">
                <img src="./incons/2.jfif" alt="VS Code">
                <p>VS Code</p>
            </div>

            <div class="app1 calc-app-btn" id="calcAppBtn">
                <img src="./incons/4.jfif" alt="Calculator">
                <p>Calculator</p>
            </div>
           

        </div>

        <!-- Calculator Window -->
        <div class="window calculator-window hide" id="calcWindow">
            <div class="window-header" id="calcHeader">
                <div class="window-title">
                    <span class="window-icon">🕸️</span> Arachne Calc
                </div>
                <div class="window-controls">
                    <button class="win-btn minimize-btn" id="minCalcBtn" title="Minimize">−</button>
                    <button class="win-btn close-btn" id="closeCalcBtn" title="Close">✕</button>
                </div>
            </div>
            <div class="calculator-body">
                <div class="calc-screen">
                    <div class="calc-history" id="calcHistory"></div>
                    <div class="calc-output" id="calcOutput">0</div>
                </div>
                <div class="calc-buttons">
                    <button class="calc-btn action-btn" data-action="clear">C</button>
                    <button class="calc-btn action-btn" data-action="toggle-sign">±</button>
                    <button class="calc-btn action-btn" data-action="percent">%</button>
                    <button class="calc-btn op-btn" data-op="/">÷</button>
                    
                    <button class="calc-btn num-btn" data-num="7">7</button>
                    <button class="calc-btn num-btn" data-num="8">8</button>
                    <button class="calc-btn num-btn" data-num="9">9</button>
                    <button class="calc-btn op-btn" data-op="*">×</button>
                    
                    <button class="calc-btn num-btn" data-num="4">4</button>
                    <button class="calc-btn num-btn" data-num="5">5</button>
                    <button class="calc-btn num-btn" data-num="6">6</button>
                    <button class="calc-btn op-btn" data-op="-">−</button>
                    
                    <button class="calc-btn num-btn" data-num="1">1</button>
                    <button class="calc-btn num-btn" data-num="2">2</button>
                    <button class="calc-btn num-btn" data-num="3">3</button>
                    <button class="calc-btn op-btn" data-op="+">+</button>
                    
                    <button class="calc-btn num-btn zero-btn" data-num="0">0</button>
                    <button class="calc-btn num-btn" data-num=".">.</button>
                    <button class="calc-btn equals-btn" data-action="equals">=</button>
                </div>
            </div>
        </div>

        <!-- Chrome Browser Window -->
        <div class="window chrome-window hide" id="chromeWindow">
            <!-- Chrome Header & Tab Bar -->
            <div class="chrome-header" id="chromeHeader">
                <div class="chrome-tabs-bar" id="chromeTabsBar">
                    <div class="tabs-list" id="tabsList">
                        <!-- Dynamic Tab items inserted by script.js -->
                    </div>
                    <button class="add-tab-btn" id="addTabBtn" title="New Tab">+</button>
                </div>
                <div class="window-controls">
                    <button class="win-btn minimize-btn" id="minChromeBtn" title="Minimize">−</button>
                    <button class="win-btn maximize-btn" id="maxChromeBtn" title="Maximize">□</button>
                    <button class="win-btn close-btn" id="closeChromeBtn" title="Close">✕</button>
                </div>
            </div>

            <!-- Chrome Toolbar Navigation & Address Bar -->
            <div class="chrome-toolbar">
                <div class="nav-controls">
                    <button class="chrome-nav-btn" id="chromeBackBtn" title="Back">←</button>
                    <button class="chrome-nav-btn" id="chromeForwardBtn" title="Forward">→</button>
                    <button class="chrome-nav-btn" id="chromeReloadBtn" title="Reload">↻</button>
                    <button class="chrome-nav-btn" id="chromeHomeBtn" title="Home">🏠</button>
                </div>

                <form class="chrome-url-form" id="chromeUrlForm">
                    <div class="url-bar-container">
                        <span class="url-security-icon" id="urlSecurityIcon">🔒</span>
                        <input type="text" class="chrome-url-input" id="chromeUrlInput" placeholder="Search Google or type a URL" autocomplete="off">
                        <button type="button" class="chrome-bookmark-btn" id="chromeBookmarkBtn" title="Bookmark this page">⭐</button>
                    </div>
                </form>

                <div class="chrome-actions">
                    <button class="chrome-action-btn" title="Extensions">🧩</button>
                    <button class="chrome-action-btn" title="Profile">🕸️</button>
                    <button class="chrome-action-btn" title="Menu">⋮</button>
                </div>
            </div>

            <!-- Bookmarks Bar -->
            <div class="chrome-bookmarks-bar">
                <button class="bookmark-chip" data-url="https://google.com"><span class="chip-icon">🔍</span> Google</button>
                <button class="bookmark-chip" data-url="https://wikipedia.org"><span class="chip-icon">🌐</span> Wikipedia</button>
                <button class="bookmark-chip" data-url="https://github.com"><span class="chip-icon">🐙</span> GitHub</button>
                <button class="bookmark-chip" data-url="https://news.ycombinator.com"><span class="chip-icon">⚡</span> Hacker News</button>
                <button class="bookmark-chip" data-url="arachne://portal"><span class="chip-icon">🕸️</span> Arachne Web</button>
            </div>

            <!-- Chrome Viewport / Tab Content Container -->
            <div class="chrome-viewport" id="chromeViewport">
                <!-- Tab views injected dynamically -->
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
